# ============================================================================

spring:
  application:
    name: template-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/apargo_wa_template}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:meenagaming12@#}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: template-hikari
      # Time zone: every timestamp is an Instant stored as UTC. Pinning the
      # JDBC session to UTC makes DB-side functions (NOW(), CURRENT_TIMESTAMP)
      # agree with the application, whatever the JVM or MySQL server zone is.
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false          # see application-dev.yaml for why
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          # Instant <-> DATETIME(6) holding UTC wall-clock time, independent of
          # the JVM default zone, so servers in different regions agree.
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        order_inserts: true
        order_updates: true

  # --------------------------------------------------------------------------
  # SERVER-SIDE serialization only: what THIS service's HTTP API emits and
  # accepts. The API is camelCase (Jackson default, no naming strategy).
  #
  # Nothing that talks to an upstream depends on this block:
  #   - Outbound clients (waba-service, storage-service, Meta) pin an explicit
  #     camelCase ObjectMapper in WebClientConfig.
  #   - Meta Graph payloads are snake_case: parsed with FacebookJsonMapper and
  #     serialized with JsonHelper.serializeWithSnakeCase.
  #
  # fail-on-unknown-properties is off, so a naming mismatch does not throw -
  # every field silently deserializes to null. Do not add a global naming
  # strategy; consumers (including the Messaging Service) read camelCase.
  # --------------------------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:16MB}
      max-request-size: ${MAX_REQUEST_SIZE:64MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ----------------------------------------------------------------------------
# Internal service-to-service surface
#
# Guards /internal/**, and is also the key this service presents when calling
# waba-service and storage-service. All three must share the same value.
# ----------------------------------------------------------------------------
internal:
  api:
    path-prefix: /internal
    api-key: ${INTERNAL_API_KEY:A7kP9xLm2Qv8Rt4Zs6Nc1Wy5Hd3Jf0B2}
    auth-enabled: ${INTERNAL_API_AUTH_ENABLED:false}

# ----------------------------------------------------------------------------
# Upstreams
# ----------------------------------------------------------------------------
facebook-service:
  base-url: ${FACEBOOK_SERVICE_BASE_URL:https://graph.facebook.com}
  api-version: ${FACEBOOK_API_VERSION:v23.0}
  connect-timeout: ${FACEBOOK_CONNECT_TIMEOUT_MS:10000}
  read-timeout: ${FACEBOOK_READ_TIMEOUT_MS:30000}
  max-in-memory-size-bytes: ${FACEBOOK_MAX_IN_MEMORY_BYTES:16777216}

waba-service:
  base-url: ${WABA_SERVICE_BASE_URL:http://146.88.24.113:8040}
  connect-timeout: ${WABA_CONNECT_TIMEOUT_MS:5000}
  read-timeout: ${WABA_READ_TIMEOUT_MS:10000}
  paths:
    credentials-by-waba: /internal/v1/waba-credentials/by-waba/{wabaId}

media-service:
  base-url: ${MEDIA_SERVICE_BASE_URL:http://146.88.24.113:8030}
  connect-timeout: ${MEDIA_CONNECT_TIMEOUT_MS:5000}
  read-timeout: ${MEDIA_READ_TIMEOUT_MS:60000}
  max-in-memory-size-bytes: ${MEDIA_MAX_IN_MEMORY_BYTES:2097152}
  batch:
    upload-path: /api/v1/media/upload/batch
    max-bytes: ${MEDIA_BATCH_MAX_BYTES:83886080}
    max-files: ${MEDIA_BATCH_MAX_FILES:20}
  single:
    upload-path: /api/v1/media/upload

# ----------------------------------------------------------------------------
# Media sync thread pool
# Was three private static final ints on MediaSyncThreadPoolConfig.
# ----------------------------------------------------------------------------
media-sync:
  pool-size: ${MEDIA_SYNC_POOL_SIZE:15}
  queue-capacity: ${MEDIA_SYNC_QUEUE_CAPACITY:100}
  keep-alive-seconds: ${MEDIA_SYNC_KEEP_ALIVE_SECONDS:60}
  await-termination-seconds: ${MEDIA_SYNC_AWAIT_TERMINATION_SECONDS:30}
  thread-name-prefix: media-sync-

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allowed-headers: ["*"]
  exposed-headers: [X-Request-Id]
  allow-credentials: true
  max-age-seconds: 3600

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://146.88.24.113:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ----------------------------------------------------------------------------
# Actuator
#
# This replaces the hand-rolled GET /api/v1/templates/health, which reported
# UP unconditionally - the only way to reach it was for the service to already
# be running, and it never checked the database or any upstream.
# ----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**, /internal/**

logging:
  level:
    root: INFO
    com.aigreentick.services.template: ${LOG_LEVEL:INFO}
  # traceId/orgId come from CorrelationIdFilter via MDC. The keys are declared
  # once in LogKeys; a rename there without a matching edit here prints blank
  # fields rather than failing, which is why they are constants in Java.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [trace=%X{traceId:-} org=%X{orgId:-} project=%X{projectId:-}] %logger{36} - %msg%n"