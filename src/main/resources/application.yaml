# ============================================================================

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:template-service}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/apargo_wa_template}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:meenagaming12@#}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      pool-name: ${DB_POOL_NAME:template-hikari}
      # Time zone: every timestamp is an Instant stored as UTC. Pinning the
      # JDBC session to UTC makes DB-side functions (NOW(), CURRENT_TIMESTAMP)
      # agree with the application, whatever the JVM or MySQL server zone is.
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false          # see application-dev.yaml for why
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: ${JPA_FORMAT_SQL:true}
        jdbc:
          batch_size: ${JPA_BATCH_SIZE:50}
          # Instant <-> DATETIME(6) holding UTC wall-clock time, independent of
          # the JVM default zone, so servers in different regions agree.
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        order_inserts: true
        order_updates: true

  # --------------------------------------------------------------------------
  # SERVER-SIDE serialization only: what THIS service's HTTP API emits and
  # accepts. The API is camelCase (Jackson default, no naming strategy).
  #
  # Nothing that talks to an upstream depends on this block:
  #   - Outbound clients (waba-service, storage-service, Meta) pin an explicit
  #     camelCase ObjectMapper in WebClientConfig.
  #   - Meta Graph payloads are snake_case: parsed with FacebookJsonMapper and
  #     serialized with JsonHelper.serializeWithSnakeCase.
  #
  # fail-on-unknown-properties is off, so a naming mismatch does not throw -
  # every field silently deserializes to null. Do not add a global naming
  # strategy; consumers (including the Messaging Service) read camelCase.
  # --------------------------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # --------------------------------------------------------------------------
  # Kafka producer - used ONLY by AuditEventPublisher (Audit Producer Guide §2).
  # Nothing else in this service talks to a broker.
  #
  # acks=all + idempotence: a record the broker acknowledged is not lost or
  # duplicated by a producer retry. retries is left at the client default
  # (effectively unlimited), bounded by delivery.timeout.ms. max.block.ms caps
  # how long send() may wait for broker metadata; sends run on the audit
  # publisher pool, never on a request thread, so this only bounds that pool.
  # --------------------------------------------------------------------------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:143.88.24.113:9092}
    producer:
      client-id: ${KAFKA_CLIENT_ID:${spring.application.name}}
      # acks and enable.idempotence are fixed by the Producer Guide, not tunables.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:120000}
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:10000}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:16MB}
      max-request-size: ${MAX_REQUEST_SIZE:64MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ----------------------------------------------------------------------------
# Internal service-to-service surface
#
# Guards /internal/**, and is also the key this service presents when calling
# waba-service and storage-service. All three must share the same value.
# ----------------------------------------------------------------------------
internal:
  api:
    path-prefix: /internal
    api-key: ${INTERNAL_API_KEY:A7kP9xLm2Qv8Rt4Zs6Nc1Wy5Hd3Jf0B2}
    auth-enabled: ${INTERNAL_API_AUTH_ENABLED:false}

# ----------------------------------------------------------------------------
# Upstreams
# ----------------------------------------------------------------------------
facebook-service:
  base-url: ${FACEBOOK_SERVICE_BASE_URL:https://graph.facebook.com}
  api-version: ${FACEBOOK_API_VERSION:v23.0}
  connect-timeout: ${FACEBOOK_CONNECT_TIMEOUT_MS:10000}
  read-timeout: ${FACEBOOK_READ_TIMEOUT_MS:30000}
  max-in-memory-size-bytes: ${FACEBOOK_MAX_IN_MEMORY_BYTES:16777216}
  template-page-size: ${FACEBOOK_TEMPLATE_PAGE_SIZE:200}

waba-service:
  base-url: ${WABA_SERVICE_BASE_URL:http://146.88.24.113:8040}
  connect-timeout: ${WABA_CONNECT_TIMEOUT_MS:5000}
  read-timeout: ${WABA_READ_TIMEOUT_MS:10000}
  max-in-memory-size-bytes: ${WABA_MAX_IN_MEMORY_BYTES:1048576}
  paths:
    credentials-by-waba: ${WABA_CREDENTIALS_PATH:/internal/v1/waba-credentials/by-waba/{wabaId}}

media-service:
  base-url: ${MEDIA_SERVICE_BASE_URL:http://146.88.24.113:8030}
  connect-timeout: ${MEDIA_CONNECT_TIMEOUT_MS:5000}
  read-timeout: ${MEDIA_READ_TIMEOUT_MS:60000}
  max-in-memory-size-bytes: ${MEDIA_MAX_IN_MEMORY_BYTES:2097152}
  batch:
    upload-path: ${MEDIA_BATCH_UPLOAD_PATH:/api/v1/media/upload/batch}
    max-bytes: ${MEDIA_BATCH_MAX_BYTES:83886080}
    max-files: ${MEDIA_BATCH_MAX_FILES:20}
  single:
    upload-path: ${MEDIA_SINGLE_UPLOAD_PATH:/api/v1/media/upload}

# ----------------------------------------------------------------------------
# Media sync thread pool
# Was three private static final ints on MediaSyncThreadPoolConfig.
# ----------------------------------------------------------------------------
media-sync:
  pool-size: ${MEDIA_SYNC_POOL_SIZE:15}
  queue-capacity: ${MEDIA_SYNC_QUEUE_CAPACITY:100}
  keep-alive-seconds: ${MEDIA_SYNC_KEEP_ALIVE_SECONDS:60}
  await-termination-seconds: ${MEDIA_SYNC_AWAIT_TERMINATION_SECONDS:30}
  thread-name-prefix: ${MEDIA_SYNC_THREAD_NAME_PREFIX:media-sync-}

# ----------------------------------------------------------------------------
# X-Idempotency-Key on create/send endpoints (API Standard §1)
# ----------------------------------------------------------------------------
# Settles templates left SUBMITTED when Meta's outcome could not be recorded
# (timeout, Meta 5xx, crash after Meta accepted). See SubmittedTemplateReconciler.
template:
  reconcile:
    enabled: ${TEMPLATE_RECONCILE_ENABLED:false}
    interval: ${TEMPLATE_RECONCILE_INTERVAL:PT5M}
    initial-delay: ${TEMPLATE_RECONCILE_INITIAL_DELAY:PT2M}
    min-age: ${TEMPLATE_RECONCILE_MIN_AGE:PT5M}
    give-up-after: ${TEMPLATE_RECONCILE_GIVE_UP_AFTER:PT30M}
    batch-size: ${TEMPLATE_RECONCILE_BATCH_SIZE:50}

idempotency:
  required: ${IDEMPOTENCY_REQUIRED:true}
  ttl: ${IDEMPOTENCY_TTL:PT24H}
  in-progress-timeout: ${IDEMPOTENCY_IN_PROGRESS_TIMEOUT:PT5M}
  purge-interval: ${IDEMPOTENCY_PURGE_INTERVAL:PT1H}
  purge-initial-delay: ${IDEMPOTENCY_PURGE_INITIAL_DELAY:PT1M}

# ----------------------------------------------------------------------------
# Audit events (Audit Producer Guide). Published to Kafka after commit by
# AuditEventPublisher; never blocks or fails a business request.
# ----------------------------------------------------------------------------
audit:
  # Off: events are built but not sent (logged at DEBUG). For local runs
  # without a broker; keep on in every shared environment.
  enabled: ${AUDIT_ENABLED:true}
  source-service: ${AUDIT_SOURCE_SERVICE:${spring.application.name}}
  # development / staging / production
  environment: ${AUDIT_ENVIRONMENT:development}
  topics:
    audit: ${AUDIT_TOPIC:apargo.audit.event}
  publisher:
    pool-size: ${AUDIT_PUBLISHER_POOL_SIZE:2}
    queue-capacity: ${AUDIT_PUBLISHER_QUEUE_CAPACITY:10000}
    await-termination-seconds: ${AUDIT_PUBLISHER_AWAIT_TERMINATION_SECONDS:15}
    thread-name-prefix: ${AUDIT_PUBLISHER_THREAD_NAME_PREFIX:audit-publisher-}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # Lists are comma-separated when set from the environment.
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  exposed-headers: ${CORS_EXPOSED_HEADERS:X-Request-Id,Location,Retry-After}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://146.88.24.113:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

# ----------------------------------------------------------------------------
# Actuator
#
# This replaces the hand-rolled GET /api/v1/templates/health, which reported
# UP unconditionally - the only way to reach it was for the service to already
# be running, and it never checked the database or any upstream.
# ----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:when-authorized}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
  paths-to-match: ${SPRINGDOC_PATHS_TO_MATCH:/api/**,/internal/**}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.apargo.services.template: ${LOG_LEVEL:DEBUG}
  # requestId/orgId/projectId/userId come from RequestIdFilter and traceId from
  # TraceContextFilter (or ScheduledJobContext for jobs) via MDC. The keys are declared
  # once in LogKeys; a rename there without a matching edit here prints blank
  # fields rather than failing, which is why they are constants in Java.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [req=%X{requestId:-} trace=%X{traceId:-} org=%X{orgId:-} project=%X{projectId:-} user=%X{userId:-}] %logger{36} - %msg%n"