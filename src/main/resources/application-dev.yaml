spring:

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/apargo_wa_messaging}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:2024@Bajajsys}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jackson:
    property-naming-strategy: SNAKE_CASE

  # data:
  #   web:
  #     pageable:
  #       serialization-mode: via-dto

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true




media-service:
  base-url: ${MEDIA_SERVICE_BASE_URL:http://146.88.24.113:8032}
  batch:
    max-bytes: 83886080
    max-files: 20
    upload-path: /api/v1/media/upload/batch
  single:
    upload-path: /api/v1/media/upload


waba-service:
  base-url: ${WABA_SERVICE_BASE_URL:http://localhost:8040}
  connect-timeout: 5000
  read-timeout: 10000
  paths:
    get-credentials: /internal/waba-accounts/{wabaAccountId}/credentials