spring:
  # .env and ../platform.env are imported by application.yaml for every profile.

  jpa:
    show-sql: ${JPA_SHOW_SQL:true}

internal:
  api:
    api-key: ${INTERNAL_API_KEY:dev-local-internal-key-not-for-any-real-use}

logging:
  level:
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_BIND:TRACE}
